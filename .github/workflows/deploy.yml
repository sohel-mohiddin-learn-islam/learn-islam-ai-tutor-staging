name: Build and Deploy AI Tutor Staging
'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI Tutor feature branch
        uses: actions/checkout@v4
        with:
          repository: sohel-mohiddin-learn-islam/learn-islam-app
          ref: feature/firebase-ai-tutor
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build for staging URL
        working-directory: source
        run: npm run build -- --base=/learn-islam-ai-tutor-staging/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
